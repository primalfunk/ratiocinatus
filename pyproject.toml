[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratiocinatus"
version = "0.4.0"
description = "Local-first evidentiary kernel for traceable reasoning analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "coverage>=7"]
fixture = ["kokoro-onnx==0.4.9", "soundfile==0.13.1", "Pillow==12.1.0"]
vad = ["silero-vad==6.2.1"]
transcription = ["openai-whisper==20250625"]

[project.scripts]
ratiocinatus = "ratiocinatus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]




